<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #eef2f7; font-family: Arial; }
        .card-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-box">
                <h2 class="mb-4 text-center">Add Student</h2>
                <form th:action="@{/save}" th:object="${student}" method="post">
                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" th:field="*{name}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Roll Number</label>
                        <input type="text" th:field="*{rollNo}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Course</label>
                        <input type="text" th:field="*{course}" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Save Student</button>
                </form>
                <a href="/" class="btn btn-secondary mt-3 w-100">Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
