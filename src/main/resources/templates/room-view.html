<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Room View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #eef2f7; font-family: Arial; }
        h2 { text-align: center; margin-top: 20px; }
        .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; padding: 30px; }
        .seat { border-radius: 10px; padding: 10px; min-height: 100px; text-align: center; font-size: 14px; font-weight: bold; }
        .filled { background: #198754; color: white; }
        .empty { background: #dee2e6; }
        .seat-number { margin-top: 8px; font-size: 12px; }
    </style>
</head>
<body>
<h2>Room [[${roomNo}]] Seating Arrangement</h2>
<div class="container-fluid">
    <div class="grid">
        <div th:each="i : ${#numbers.sequence(1,80)}">
            <div th:with="student=${seatMap[i-1]}">
                <div th:if="${student != null}" class="seat filled">
                    <div th:text="${student.name}"></div>
                    <div th:text="${student.rollNo}"></div>
                    <div th:text="${student.course}"></div>
                    <div class="seat-number">Seat [[${i}]]</div>
                </div>
                <div th:if="${student == null}" class="seat empty">
                    Empty Seat
                    <div class="seat-number">Seat [[${i}]]</div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="text-center mb-5">
    <a href="/rooms" class="btn btn-dark">Back to Rooms</a>
</div>
</body>
</html>
