<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fb; font-family: Arial; }
        .room-card { background: white; border-radius: 15px; padding: 30px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.1); transition: 0.3s; }
        .room-card:hover { transform: scale(1.03); }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-5">Examination Rooms</h2>
    <div class="row g-4">
        <div class="col-md-3" th:each="room : ${rooms}">
            <div class="room-card">
                <h3>Room [[${room}]]</h3>
                <a th:href="@{'/room/' + ${room}}" class="btn btn-primary mt-3">View Seats</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
